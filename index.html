<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>深淵病棟 - Single File Horror</title>
  <style>
    :root {
      --bg: #050505;
      --panel: rgba(10, 10, 10, 0.82);
      --text: #e8e8e8;
      --danger: #ff2d55;
      --safe: #56f58f;
      --accent: #87c1ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(circle at 50% 20%, #111 0%, #000 70%);
      color: var(--text);
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .wrap {
      width: min(96vw, 980px);
      display: grid;
      gap: 10px;
    }

    #hud {
      background: var(--panel);
      border: 1px solid #262626;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(2px);
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      font-size: 14px;
    }

    #hud b { color: var(--accent); }

    #game {
      width: min(96vw, 980px);
      aspect-ratio: 16 / 9;
      background: #040404;
      border: 1px solid #1b1b1b;
      border-radius: 12px;
      display: block;
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      background: rgba(0,0,0,0);
      transition: background .25s;
    }

    #message {
      max-width: 640px;
      width: min(92vw, 640px);
      background: rgba(0,0,0,0.86);
      border: 1px solid #303030;
      border-radius: 12px;
      padding: 18px;
      line-height: 1.6;
      transform: scale(0.95);
      opacity: 0;
      transition: .25s;
      text-align: left;
    }

    #message h1 {
      margin: 0 0 8px;
      font-size: 24px;
      letter-spacing: .08em;
    }

    #message p { margin: 8px 0; }

    #message button {
      margin-top: 10px;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #555;
      color: #fff;
      background: linear-gradient(#222, #111);
      cursor: pointer;
      pointer-events: auto;
    }

    #overlay.show {
      pointer-events: auto;
      background: rgba(0,0,0,0.52);
    }

    #overlay.show #message {
      transform: scale(1);
      opacity: 1;
    }

    #puzzleOverlay {
      position: fixed;
      right: 14px;
      bottom: 14px;
      width: min(92vw, 360px);
      background: rgba(0,0,0,0.86);
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      padding: 12px;
      display: none;
      z-index: 20;
    }
    #puzzleOverlay.show { display: block; }
    #puzzleOverlay .seq { color: #ffd56b; letter-spacing: .2em; margin: 6px 0; }
    #puzzleOverlay .choices { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-top: 8px; }
    #puzzleOverlay button { padding: 8px; border-radius: 6px; border: 1px solid #555; background:#191919; color:#eee; cursor:pointer; }
    #puzzleOverlay .meta { display:flex; justify-content:space-between; font-size:12px; opacity:.9; margin-top:6px; }

    #jumpscare {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(120,0,0,0.93);
      color: #fff;
      font-size: clamp(34px, 6vw, 72px);
      font-weight: 800;
      letter-spacing: .14em;
      text-shadow: 0 0 16px #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity .08s;
      mix-blend-mode: screen;
    }

    #jumpscare.show { opacity: 1; }

    .danger { color: var(--danger); font-weight: 700; }
    .safe { color: var(--safe); font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="hud">
      <div>目標: <b>鍵を4つ集めて隔離扉を解放</b></div>
      <div>鍵: <span id="keys">0 / 4</span></div>
      <div>正気度: <span id="sanity">100</span></div>
      <div>足音: <span id="proximity">遠い</span></div>
      <div id="timerWrap" style="display:none;">RTA: <span id="timer">00:00.00</span></div>
    </div>
    <canvas id="game" width="1280" height="720"></canvas>
  </div>

  <div id="overlay" class="show">
    <div id="message">
      <h1>深淵病棟</h1>
      <p>1999年、封鎖された第七病棟で患者が消えた夜。あなたは真相を追う記録係として潜入した。</p>
      <p>操作: <b>WASD / 矢印</b>で移動、<b>Shift</b>で走る（正気度消費）。
      4つの隔離鍵を拾い、最深部の青い隔離扉を解放せよ。</p>
      <p>廊下には血文字のカルテが散乱し、各病室には封鎖された記憶が残っている。</p>
      <p class="danger">追跡者「屍看守」は気配と焦りに反応する。見つかれば、終わりだ。</p>
      <button id="startBtn">開始する</button>
    </div>
  </div>

  <div id="jumpscare">見 つ け た</div>

  <div id="puzzleOverlay">
    <div id="puzzleTitle">鍵の封印解除</div>
    <div id="puzzleDesc">表示順に記号を押して封印を解除せよ。</div>
    <div class="seq" id="puzzleSeq"></div>
    <div class="choices" id="puzzleChoices"></div>
    <div class="meta"><span id="puzzleProgress">0 / 0</span><span id="puzzleTime">0.0s</span></div>
    <button id="puzzleCancel">中断 (Esc)</button>
  </div>


  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const keysEl = document.getElementById('keys');
      const sanityEl = document.getElementById('sanity');
      const proximityEl = document.getElementById('proximity');
      const timerWrapEl = document.getElementById('timerWrap');
      const timerEl = document.getElementById('timer');
      const overlay = document.getElementById('overlay');
      const message = document.getElementById('message');
      const jumpscare = document.getElementById('jumpscare');
      const startBtn = document.getElementById('startBtn');
      const puzzleOverlay = document.getElementById('puzzleOverlay');
      const puzzleSeqEl = document.getElementById('puzzleSeq');
      const puzzleChoicesEl = document.getElementById('puzzleChoices');
      const puzzleProgressEl = document.getElementById('puzzleProgress');
      const puzzleTimeEl = document.getElementById('puzzleTime');
      const puzzleCancelBtn = document.getElementById('puzzleCancel');

      const world = {
        w: 2400,
        h: 1500,
        walls: [],
        keys: [],
        exit: { x: 2220, y: 1320, w: 90, h: 120 }
      };

      const player = {
        x: 120,
        y: 120,
        r: 20,
        speed: 2.5,
        sprint: 5.6,
        sanity: 100,
        collected: 0
      };

      const ghostDefaults = {
        r: 30,
        speed: 1.25,
        rageSpeed: 2.55
      };
      let ghosts = [];

      let running = false;
      let showTimer = false;
      let timerStartedAt = 0;
      const puzzleState = { active: false, key: null, sequence: [], progress: 0, endAt: 0 };
      let gameOver = false;
      let win = false;
      const pressed = new Set();
      let shake = 0;
      let time = 0;

      function makeWalls() {
        const frame = 80;
        world.walls = [
          { x: 0, y: 0, w: world.w, h: frame },
          { x: 0, y: world.h - frame, w: world.w, h: frame },
          { x: 0, y: 0, w: frame, h: world.h },
          { x: world.w - frame, y: 0, w: frame, h: world.h },

          // maze columns (split sections so every lane has at least one bypass)
          { x: 300, y: 80, w: 70, h: 300 },
          { x: 300, y: 540, w: 70, h: 350 },
          { x: 300, y: 1040, w: 70, h: 370 },

          { x: 560, y: 220, w: 70, h: 340 },
          { x: 560, y: 720, w: 70, h: 320 },

          { x: 820, y: 80, w: 70, h: 260 },
          { x: 820, y: 510, w: 70, h: 430 },
          { x: 820, y: 1110, w: 70, h: 300 },

          { x: 1080, y: 250, w: 70, h: 320 },
          { x: 1080, y: 760, w: 70, h: 330 },

          { x: 1340, y: 80, w: 70, h: 310 },
          { x: 1340, y: 560, w: 70, h: 360 },
          { x: 1340, y: 1080, w: 70, h: 330 },

          { x: 1600, y: 240, w: 70, h: 320 },
          { x: 1600, y: 720, w: 70, h: 330 },

          { x: 1860, y: 80, w: 70, h: 280 },
          { x: 1860, y: 520, w: 70, h: 380 },
          { x: 1860, y: 1070, w: 70, h: 340 },

          // maze rows with intentional door gaps between segments
          { x: 180, y: 430, w: 420, h: 70 },
          { x: 720, y: 430, w: 560, h: 70 },
          { x: 1440, y: 430, w: 760, h: 70 },

          { x: 260, y: 820, w: 500, h: 70 },
          { x: 910, y: 820, w: 560, h: 70 },
          { x: 1620, y: 820, w: 520, h: 70 },

          { x: 180, y: 1180, w: 560, h: 70 },
          { x: 900, y: 1180, w: 620, h: 70 },
          { x: 1680, y: 1180, w: 420, h: 70 }
        ];
      }

      function pointBlocked(x, y, radius = 18) {
        const c = { x, y, r: radius };
        if (x < 120 || y < 120 || x > world.w - 120 || y > world.h - 120) return true;
        for (const wall of world.walls) {
          if (circleRectCollide(c, wall)) return true;
        }
        return false;
      }

      function makeKeys() {
        const candidates = [
          { x: 210, y: 1330, r: 12, got: false, retryAt: 0, id: "k1" },
          { x: 980, y: 180, r: 12, got: false, retryAt: 0, id: "k2" },
          { x: 1420, y: 1010, r: 12, got: false, retryAt: 0, id: "k3" },
          { x: 2150, y: 1260, r: 12, got: false, retryAt: 0, id: "k4" },
          { x: 1990, y: 220, r: 12, got: false, retryAt: 0, id: "k5" },
          { x: 640, y: 1320, r: 12, got: false, retryAt: 0, id: "k6" }
        ];

        world.keys = [];
        for (const k of candidates) {
          if (!pointBlocked(k.x, k.y, 24)) world.keys.push(k);
          if (world.keys.length >= 4) break;
        }

        while (world.keys.length < 4) {
          const x = 160 + Math.random() * (world.w - 320);
          const y = 160 + Math.random() * (world.h - 320);
          if (pointBlocked(x, y, 24)) continue;
          world.keys.push({ x, y, r: 12, got: false, retryAt: 0, id: Math.random().toString(36).slice(2) });
        }
      }

      makeWalls();
      makeKeys();

      function createGhost(x, y, speedBias = 0) {
        return {
          x,
          y,
          r: ghostDefaults.r,
          speed: ghostDefaults.speed + speedBias,
          rageSpeed: ghostDefaults.rageSpeed + speedBias * 1.1,
          detectRange: 430 + Math.random() * 120,
          wanderX: x,
          wanderY: y,
          wanderAt: 0,
          rage: 0,
          visiblePulse: 0
        };
      }

      function initGhosts() {
        ghosts = [createGhost(2100, 240, 0)];
      }

      function spawnAdditionalGhost() {
        for (let i = 0; i < 32; i++) {
          const ang = Math.random() * Math.PI * 2;
          const dist = 560 + Math.random() * 420;
          const x = Math.max(120, Math.min(world.w - 120, player.x + Math.cos(ang) * dist));
          const y = Math.max(120, Math.min(world.h - 120, player.y + Math.sin(ang) * dist));
          if (distance({ x, y }, player) < 480) continue;
          ghosts.push(createGhost(x, y, Math.min(0.4, player.collected * 0.05)));
          return;
        }
        ghosts.push(createGhost(world.w - 180, world.h - 180, Math.min(0.4, player.collected * 0.05)));
      }

      function formatTime(ms) {
        const total = Math.max(0, ms);
        const m = Math.floor(total / 60000);
        const s = Math.floor((total % 60000) / 1000);
        const cs = Math.floor((total % 1000) / 10);
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
      }
      function closePuzzle(applyRetry = true) {
        if (applyRetry && puzzleState.key) puzzleState.key.retryAt = performance.now() + 900;
        puzzleState.active = false;
        puzzleState.key = null;
        puzzleState.sequence = [];
        puzzleState.progress = 0;
        puzzleOverlay.classList.remove('show');
        pressed.clear();
      }

      function failPuzzle(cost = 10) {
        player.sanity = Math.max(0, player.sanity - cost);
        shake = Math.max(shake, 6);
        closePuzzle(true);
      }

      function completePuzzle() {
        if (!puzzleState.key) return;
        puzzleState.key.got = true;
        player.collected++;
        shake = 10;
        spawnAdditionalGhost();
        closePuzzle(false);
      }

      function openPuzzleForKey(keyObj) {
        if (puzzleState.active || keyObj.got) return;
        const symbols = ['▲', '●', '◆', '■'];
        const sequence = Array.from({ length: 5 }, () => symbols[Math.floor(Math.random() * symbols.length)]);
        const shuffled = [...symbols].sort(() => Math.random() - 0.5);

        puzzleState.active = true;
        puzzleState.key = keyObj;
        puzzleState.sequence = sequence;
        puzzleState.progress = 0;
        puzzleState.endAt = performance.now() + 8000;

        puzzleSeqEl.textContent = sequence.join(' ');
        puzzleChoicesEl.innerHTML = '';
        shuffled.forEach((sym) => {
          const btn = document.createElement('button');
          btn.textContent = sym;
          btn.dataset.sym = sym;
          puzzleChoicesEl.appendChild(btn);
        });
        puzzleProgressEl.textContent = `0 / ${sequence.length}`;
        puzzleOverlay.classList.add('show');
        pressed.clear();
      }

      initGhosts();

      function distance(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      function circleRectCollide(c, r) {
        const closestX = Math.max(r.x, Math.min(c.x, r.x + r.w));
        const closestY = Math.max(r.y, Math.min(c.y, r.y + r.h));
        const dx = c.x - closestX;
        const dy = c.y - closestY;
        return dx * dx + dy * dy < c.r * c.r;
      }

      function resolveWallOverlap(circle) {
        for (let iter = 0; iter < 4; iter++) {
          let collided = false;
          for (const wall of world.walls) {
            if (!circleRectCollide(circle, wall)) continue;

            const closestX = Math.max(wall.x, Math.min(circle.x, wall.x + wall.w));
            const closestY = Math.max(wall.y, Math.min(circle.y, wall.y + wall.h));
            let dx = circle.x - closestX;
            let dy = circle.y - closestY;
            let dist = Math.hypot(dx, dy);

            if (dist < 0.001) {
              const centerX = wall.x + wall.w / 2;
              const centerY = wall.y + wall.h / 2;
              dx = circle.x - centerX;
              dy = circle.y - centerY;
              if (Math.abs(dx) > Math.abs(dy)) dy = 0;
              else dx = 0;
              dist = Math.hypot(dx, dy) || 1;
            }

            const push = circle.r - dist + 0.2;
            circle.x += (dx / dist) * push;
            circle.y += (dy / dist) * push;
            collided = true;
          }
          if (!collided) break;
        }
      }

      function movePlayer(dx, dy) {
        const steps = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 8));
        const stepX = dx / steps;
        const stepY = dy / steps;

        for (let i = 0; i < steps; i++) {
          player.x += stepX;
          resolveWallOverlap(player);
          player.y += stepY;
          resolveWallOverlap(player);
        }
      }

      function hasWallBetween(a, b) {
        const d = distance(a, b);
        const steps = Math.max(2, Math.floor(d / 12));
        for (let i = 1; i < steps; i++) {
          const t = i / steps;
          const sx = a.x + (b.x - a.x) * t;
          const sy = a.y + (b.y - a.y) * t;
          for (const w of world.walls) {
            if (sx >= w.x && sx <= w.x + w.w && sy >= w.y && sy <= w.y + w.h) return true;
          }
        }
        return false;
      }

      function canSeeGhost(g) {
        const d = distance(player, g);
        if (d > 230) return false;
        return !hasWallBetween(player, g);
      }

      function update(dt) {
        if (!running || gameOver || win) return;

        time += dt;
        const moveX = (pressed.has('d') || pressed.has('arrowright') ? 1 : 0)
          - (pressed.has('a') || pressed.has('arrowleft') ? 1 : 0);
        const moveY = (pressed.has('s') || pressed.has('arrowdown') ? 1 : 0)
          - (pressed.has('w') || pressed.has('arrowup') ? 1 : 0);

        const mag = Math.hypot(moveX, moveY) || 1;
        const sprinting = pressed.has('shift') && player.sanity > 8;
        const speed = sprinting ? player.sprint : player.speed;

        movePlayer((moveX / mag) * speed * dt * 60, (moveY / mag) * speed * dt * 60);

        if (sprinting) {
          player.sanity -= 19 * dt;
        } else {
          player.sanity += 6 * dt;
        }

        // Ghost behavior: detect player in range, otherwise wander inside map.
        for (const g of ghosts) {
          const distToPlayer = distance(player, g);
          const detected = distToPlayer <= g.detectRange && !hasWallBetween(g, player);
          if (detected) g.rage = Math.min(1, g.rage + dt * 0.5);
          else g.rage = Math.max(0, g.rage - dt * 0.2);
        }

        let sawAny = false;
        for (const g of ghosts) {
          if (canSeeGhost(g)) {
            sawAny = true;
            g.visiblePulse = 1;
          }
          g.visiblePulse = Math.max(0, g.visiblePulse - dt * 2.2);
        }
        if (sawAny) player.sanity -= 30 * dt;

        player.sanity = Math.max(0, Math.min(100, player.sanity));

        for (const g of ghosts) {
          const distToPlayer = distance(player, g);
          const detected = distToPlayer <= g.detectRange && !hasWallBetween(g, player);
          const gs = (g.speed + (g.rageSpeed - g.speed) * g.rage) * dt * 60;

          if (detected) {
            const gx = player.x - g.x;
            const gy = player.y - g.y;
            const gd = Math.hypot(gx, gy) || 1;
            g.x += (gx / gd) * gs;
            g.y += (gy / gd) * gs;
          } else {
            if (performance.now() >= g.wanderAt || distance(g, { x: g.wanderX, y: g.wanderY }) < 30) {
              g.wanderX = 120 + Math.random() * (world.w - 240);
              g.wanderY = 120 + Math.random() * (world.h - 240);
              g.wanderAt = performance.now() + 1400 + Math.random() * 2200;
            }
            const wx = g.wanderX - g.x;
            const wy = g.wanderY - g.y;
            const wd = Math.hypot(wx, wy) || 1;
            g.x += (wx / wd) * (gs * 0.52);
            g.y += (wy / wd) * (gs * 0.52);
          }

          g.x = Math.max(100, Math.min(world.w - 100, g.x));
          g.y = Math.max(100, Math.min(world.h - 100, g.y));
        }

        for (const k of world.keys) {
          if (!k.got && !puzzleState.active && performance.now() >= (k.retryAt || 0)
            && distance(player, k) < player.r + k.r + 3) {
            openPuzzleForKey(k);
            break;
          }
        }

        if (puzzleState.active) {
          const remain = Math.max(0, puzzleState.endAt - performance.now());
          puzzleTimeEl.textContent = `${(remain / 1000).toFixed(1)}s`;
          if (remain <= 0) failPuzzle(12);
        }

        const touchGhost = ghosts.some((g) => distance(player, g) < player.r + g.r + 4);
        if (touchGhost || player.sanity <= 0) {
          triggerGameOver();
        }

        const e = world.exit;
        if (player.collected === world.keys.length
          && player.x > e.x && player.x < e.x + e.w
          && player.y > e.y && player.y < e.y + e.h) {
          triggerWin();
        }

        keysEl.textContent = `${player.collected} / ${world.keys.length}`;
        sanityEl.textContent = Math.round(player.sanity);

        const pd = ghosts.length ? Math.min(...ghosts.map((g) => distance(player, g))) : 9999;
        proximityEl.textContent = pd < 130 ? '背後にいる' : pd < 260 ? '非常に近い' : pd < 420 ? '近い' : pd < 650 ? '中距離' : '遠い';
        if (pd < 260) proximityEl.className = 'danger';
        else if (pd < 450) proximityEl.className = '';
        else proximityEl.className = 'safe';
      }

      function triggerGameOver() {
        gameOver = true;
        running = false;
        jumpscare.classList.add('show');
        setTimeout(() => jumpscare.classList.remove('show'), 220);
        showPanel('GAME OVER',
          '屍看守に記録帳を奪われた。あなたの名は次のカルテに赤字で刻まれる。<br><br>Rキーでリトライ');
      }

      function triggerWin() {
        win = true;
        running = false;
        showPanel('脱出成功',
          '隔離扉の外へ転がり出た瞬間、記録帳の最後の頁が燃え上がる。<br>「第七病棟の主治医は、あなた自身だった」<br><br>Rキーで再挑戦');
      }

      function showPanel(title, body) {
        message.innerHTML = `<h1>${title}</h1><p>${body}</p><button id="retryBtn">閉じる</button>`;
        overlay.classList.add('show');
        const retryBtn = document.getElementById('retryBtn');
        retryBtn.addEventListener('click', () => overlay.classList.remove('show'));
      }

      function reset() {
        player.x = 120;
        player.y = 120;
        player.sanity = 100;
        player.collected = 0;
        makeKeys();
        initGhosts();
        gameOver = false;
        win = false;
        running = true;
        closePuzzle(false);
        timerStartedAt = performance.now();
        overlay.classList.remove('show');
      }

      const sprites = {
        player: [
          '..11..',
          '.1221.',
          '122221',
          '123321',
          '.1331.',
          '.1..1.'
        ],
        ghost: [
          '..1111..',
          '.1222221.',
          '123333321',
          '123444321',
          '125454521',
          '125666521',
          '.1266621.',
          '..1....1.'
        ],
        key: [
          '..22..',
          '.2332.',
          '..22..',
          '..2...',
          '.2222.',
          '..2.2.'
        ]
      };

      const spritePalettes = {
        player: { '1': '#d8f2ff', '2': '#a8d8ff', '3': '#4ba6ff' },
        ghost: { '1': '#d9d9d9', '2': '#bfbfbf', '3': '#732222', '4': '#2f0000', '5': '#b10000', '6': '#ff5858' },
        key: { '2': '#ffe36d', '3': '#f6bd2b' }
      };

      function drawSprite(cx, cy, pixelSize, pattern, palette, alpha = 1) {
        ctx.save();
        ctx.globalAlpha = alpha;
        const h = pattern.length;
        const w = pattern[0].length;
        const ox = cx - (w * pixelSize) / 2;
        const oy = cy - (h * pixelSize) / 2;

        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const code = pattern[y][x];
            if (code === '.') continue;
            ctx.fillStyle = palette[code] || '#fff';
            ctx.fillRect(ox + x * pixelSize, oy + y * pixelSize, pixelSize, pixelSize);
          }
        }
        ctx.restore();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const camX = Math.max(0, Math.min(world.w - canvas.width, player.x - canvas.width / 2));
        const camY = Math.max(0, Math.min(world.h - canvas.height, player.y - canvas.height / 2));

        if (shake > 0) {
          shake *= 0.84;
          ctx.save();
          ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        }

        ctx.fillStyle = '#0b0b0b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(-camX, -camY);

        // Floor noise
        for (let i = 0; i < 280; i++) {
          const n = (Math.sin(i * 12.9898 + time * 0.3) * 43758.5453) % 1;
          const x = ((i * 161) % world.w);
          const y = ((i * 239) % world.h);
          ctx.fillStyle = `rgba(255,255,255,${0.02 + Math.abs(n) * 0.03})`;
          ctx.fillRect(x, y, 2, 2);
        }

        // Exit
        ctx.fillStyle = player.collected === world.keys.length ? '#3ca0ff' : '#14314f';
        ctx.fillRect(world.exit.x, world.exit.y, world.exit.w, world.exit.h);
        ctx.strokeStyle = '#a6d2ff';
        ctx.lineWidth = 3;
        ctx.strokeRect(world.exit.x, world.exit.y, world.exit.w, world.exit.h);

        // Walls (pixel-style tiles)
        for (const w of world.walls) {
          ctx.fillStyle = '#242424';
          ctx.fillRect(w.x, w.y, w.w, w.h);
          for (let yy = w.y; yy < w.y + w.h; yy += 16) {
            for (let xx = w.x; xx < w.x + w.w; xx += 16) {
              const tone = ((xx / 16 + yy / 16) % 2 === 0) ? '#2c2c2c' : '#303030';
              ctx.fillStyle = tone;
              ctx.fillRect(xx + 1, yy + 1, 14, 14);
            }
          }
        }

        // Keys (pixel sprite)
        for (const k of world.keys) {
          if (k.got) continue;
          const pulse = 0.68 + Math.sin(time * 7 + k.x) * 0.22;
          ctx.fillStyle = `rgba(255,223,80,${pulse * 0.45})`;
          ctx.fillRect(k.x - 18, k.y - 18, 36, 36);
          drawSprite(k.x, k.y, 4, sprites.key, spritePalettes.key, 0.96);
        }

        // Ghosts (pixel sprite)
        ghosts.forEach((g, idx) => {
          const ghostAlpha = 0.45 + g.visiblePulse * 0.55;
          drawSprite(g.x, g.y, 8, sprites.ghost, spritePalettes.ghost, ghostAlpha);

          const tendril = 8 + Math.sin(time * 10 + g.x * 0.05 + idx) * 5;
          ctx.strokeStyle = `rgba(120,0,0,${0.28 + g.visiblePulse * 0.35})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(g.x - 26, g.y + 12);
          ctx.lineTo(g.x - 44 - tendril, g.y + 26);
          ctx.moveTo(g.x + 24, g.y + 10);
          ctx.lineTo(g.x + 42 + tendril, g.y + 32);
          ctx.stroke();
        });

        // Player (pixel sprite)
        drawSprite(player.x, player.y, 7, sprites.player, spritePalettes.player, 1);

        ctx.restore();

        // Brightness MAX mode
        // Requested temporary setting: disable darkness mask/flicker/vignette.
        // Keep only a very light scanline noise so the scene is fully visible.
        for (let i = 0; i < 18; i++) {
          const y = (Math.sin(time * 90 + i * 13.1) * 0.5 + 0.5) * canvas.height;
          ctx.fillStyle = 'rgba(255,255,255,0.01)';
          ctx.fillRect(0, y, canvas.width, 1);
        }

        if (shake > 0) ctx.restore();
      }

      let last = performance.now();
      function loop(now) {
        const dt = Math.min(0.033, (now - last) / 1000);
        last = now;
        update(dt);
        if (showTimer) timerEl.textContent = formatTime(performance.now() - timerStartedAt);
        draw();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);

      window.addEventListener('keydown', (e) => {
        pressed.add(e.key.toLowerCase());
        if (e.key.toLowerCase() === 'r') reset();
        if (e.key.toLowerCase() === 't') {
          showTimer = !showTimer;
          timerWrapEl.style.display = showTimer ? 'block' : 'none';
        }
        if (e.key.toLowerCase() === 'escape' && puzzleState.active) {
          failPuzzle(6);
        }
      });
      window.addEventListener('keyup', (e) => pressed.delete(e.key.toLowerCase()));

      puzzleChoicesEl.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-sym]');
        if (!btn || !puzzleState.active) return;
        const expected = puzzleState.sequence[puzzleState.progress];
        if (btn.dataset.sym === expected) {
          puzzleState.progress++;
          puzzleProgressEl.textContent = `${puzzleState.progress} / ${puzzleState.sequence.length}`;
          if (puzzleState.progress >= puzzleState.sequence.length) completePuzzle();
        } else {
          failPuzzle(14);
        }
      });

      puzzleCancelBtn.addEventListener('click', () => {
        if (puzzleState.active) failPuzzle(6);
      });

      startBtn.addEventListener('click', () => {
        overlay.classList.remove('show');
        running = true;
        timerStartedAt = performance.now();
      });
    })();
  </script>
</body>
</html>
